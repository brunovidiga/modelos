<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animale - Hero Section</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="container"></div>

    <div class="ui">
        <div class="slide-info">
            <span class="slide-number">01</span>
            <h2 class="slide-name">PANTERA</h2>
        </div>
    </div>

    <div class="nav">
        <button class="nav-arrow prev" aria-label="Anterior">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <div class="nav-dots">
            <span class="nav-dot active" data-index="0"></span>
            <span class="nav-dot" data-index="1"></span>
            <span class="nav-dot" data-index="2"></span>
            <span class="nav-dot" data-index="3"></span>
        </div>
        <button class="nav-arrow next" aria-label="Próximo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
